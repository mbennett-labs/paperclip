name: QSL Native Mission Validation

on:
  push:
    branches:
      - feat/qsl-native-mission-orchestration-v0-1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter @paperclipai/server typecheck

      - name: Run QSL mission tests
        run: >-
          pnpm exec vitest run
          server/src/__tests__/qsl-operator-mission-dispatch.test.ts
          server/src/__tests__/qsl-operator-mission-reconcile.test.ts
          server/src/__tests__/qsl-operator-review-dispatch.test.ts
