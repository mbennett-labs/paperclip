name: QSL Staging Operator Bootstrap Cancel Sentinel

on:
  push:
    branches:
      - ops/staging-bridge-v0
    paths:
      - ".qsl/staging-ops/operator-bootstrap-cancel.json"

permissions:
  contents: read

concurrency:
  group: qsl-staging-operator-bootstrap
  cancel-in-progress: true

jobs:
  cancel-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "No staging mutation. Cancelling/replacing any pending bootstrap in this concurrency group."
