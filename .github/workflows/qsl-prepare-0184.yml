name: QSL Prepare Mission Uniqueness Migration

on:
  push:
    branches:
      - feat/qsl-native-mission-orchestration-v0-1
    paths:
      - .github/qsl/prepare-0184-operator-mission-uniqueness.mjs

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/qsl-native-mission-orchestration-v0-1
          fetch-depth: 0

      - name: Prepare deterministic 0184 migration
        run: node .github/qsl/prepare-0184-operator-mission-uniqueness.mjs

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration numbering and safety
        run: pnpm --filter @paperclipai/db check:migrations

      - name: Validate server types
        run: pnpm --filter @paperclipai/server typecheck

      - name: Validate Mission Control focused tests
        run: >-
          pnpm --filter @paperclipai/server exec vitest run
          src/__tests__/qsl-mission-contract-retry.test.ts
          src/__tests__/qsl-operator-review-dispatch.test.ts
          src/__tests__/qsl-operator-mission-reconcile.test.ts
          src/__tests__/qsl-operator-mission-dispatch.test.ts
          src/__tests__/qsl-operator-mission-receipt-agent.test.ts
          src/__tests__/qsl-operator-mission-native-boundary.test.ts
          src/__tests__/qsl-operator-mission-evidence-retention.test.ts

      - name: Verify uniqueness source boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'uniqueIndex("operator_missions_company_mission_id_uq")' packages/db/src/schema/operator_missions.ts
          grep -F 'CREATE UNIQUE INDEX IF NOT EXISTS "operator_missions_company_mission_id_uq"' packages/db/src/migrations/0184_operator_mission_company_mission_unique.sql
          grep -F 'DROP INDEX IF EXISTS "operator_missions_company_mission_id_idx"' packages/db/src/migrations/0184_operator_mission_company_mission_unique.sql
          grep -F '"tag": "0184_operator_mission_company_mission_unique"' packages/db/src/migrations/meta/_journal.json

      - name: Commit prepared migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/db/src/schema/operator_missions.ts \
            packages/db/src/migrations/0184_operator_mission_company_mission_unique.sql \
            packages/db/src/migrations/meta/_journal.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No migration changes prepared'; exit 1; }
          git commit -m 'fix(qsl): enforce operator mission id uniqueness'
          git push origin HEAD:feat/qsl-native-mission-orchestration-v0-1
