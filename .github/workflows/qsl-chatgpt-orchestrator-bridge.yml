name: QSL ChatGPT Orchestrator Bridge V1

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - feat/qsl-chatgpt-orchestrator-bridge-v1
    paths:
      - "server/src/routes/qsl-orchestrator-bridge.ts"
      - "server/src/__tests__/qsl-orchestrator-bridge*.test.ts"
      - "packages/shared/src/types/qsl-orchestrator-bridge.ts"
      - "packages/shared/src/validators/qsl-orchestrator-bridge.ts"
      - "scripts/qsl-chatgpt-orchestrator-bridge/*"
      - ".github/workflows/qsl-chatgpt-orchestrator-bridge.yml"

jobs:
  dispatch:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 38 &&
      startsWith(github.event.comment.body, '```json') &&
      contains(github.event.comment.body, '"operation"') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse and dispatch bridge request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAPERCLIP_API_BASE: ${{ vars.PAPERCLIP_API_BASE || 'http://localhost:3101' }}
          PAPERCLIP_COMPANY_ID: ${{ vars.PAPERCLIP_COMPANY_ID }}
          BRIDGE_REQUEST_ISSUE: "38"
          BRIDGE_RESULT_ISSUE: "34"
        run: |
          set -euo pipefail

          COMMENT_BODY=$(cat <<'GHCOMMENT'
          ${{ github.event.comment.body }}
          GHCOMMENT
          )

          REQUEST_JSON=$(echo "$COMMENT_BODY" | sed -n '/^```json/,/^```/p' | sed '1d;$d')

          if [[ -z "$REQUEST_JSON" ]]; then
            echo "No JSON request block found in comment"
            exit 0
          fi

          # Validate the request is valid JSON before passing to runner
          if ! echo "$REQUEST_JSON" | jq empty 2>&1; then
            echo "FAIL: request is not valid JSON"
            exit 0
          fi

          echo "=== Bridge request dispatched ==="
          echo "operation: $(echo "$REQUEST_JSON" | jq -r '.operation // "unknown"')"
          echo "request_id: $(echo "$REQUEST_JSON" | jq -r '.request_id // "auto"')"

          bash scripts/qsl-chatgpt-orchestrator-bridge/run-bridge-operation.sh \
            --request-json "$REQUEST_JSON" \
            --api-base "${PAPERCLIP_API_BASE}" \
            --company-id "${PAPERCLIP_COMPANY_ID}" \
            --result-issue "${BRIDGE_RESULT_ISSUE}"

  validate:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/qsl-chatgpt-orchestrator-bridge-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter @paperclipai/server typecheck

      - name: Run orchestrator bridge tests
        run: |
          pnpm exec vitest run \
            server/src/__tests__/qsl-orchestrator-bridge.test.ts \
            server/src/__tests__/qsl-orchestrator-bridge-runner.test.ts

      - name: Prove no shell orchestration in bridge routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'node:child_process|exec\(|spawn\(' server/src/routes/qsl-orchestrator-bridge.ts; then
            echo "FAIL: shell orchestration leaked into orchestrator bridge."
            exit 41
          fi
          echo "PASS: orchestrator bridge is native Paperclip API only."

      - name: Prove no credential export in bridge routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'process\.env\.(OPENAI|ANTHROPIC|API_KEY|SECRET|TOKEN|KEY)' server/src/routes/qsl-orchestrator-bridge.ts; then
            echo "FAIL: credential export detected in bridge route."
            exit 42
          fi
          echo "PASS: no credential export in bridge route."