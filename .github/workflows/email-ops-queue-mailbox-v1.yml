name: Email Ops Queue Mailbox V1

on:
  push:
    branches:
      - feat/email-operations-mailbox-identity-v1

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[mailbox-v1-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Apply mailbox queue patch
        run: node scripts/email-ops-queue-mailbox-v1.mjs

      - name: Email plugin typecheck
        run: pnpm --filter @qsl/plugin-email typecheck

      - name: Email plugin tests
        run: pnpm exec vitest run packages/plugins/plugin-email/tests

      - name: Email plugin build
        run: pnpm --filter @qsl/plugin-email build

      - name: Paperclip UI build
        run: pnpm --filter @paperclipai/ui build

      - name: Verify and commit validated application changes
        run: |
          git diff --check -- packages/plugins/plugin-email/src/worker.ts packages/plugins/plugin-email/src/ui/store-intake-page.tsx
          git rm scripts/email-ops-queue-mailbox-v1.mjs .github/workflows/email-ops-queue-mailbox-v1.yml
          git add packages/plugins/plugin-email/src/worker.ts packages/plugins/plugin-email/src/ui/store-intake-page.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(email): promote mailbox identity into queue [mailbox-v1-applied]"
          git push origin HEAD:feat/email-operations-mailbox-identity-v1
